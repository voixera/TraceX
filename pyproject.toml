[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracex"
version = "0.1.0"
description = "TraceX — Open-Source OSINT Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TraceX Contributors" }]
keywords = ["osint", "intelligence", "security", "investigation", "cli", "telegram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "aiogram>=3.5",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "dnslib>=0.4",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "websockets>=12.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
    "playwright>=1.40",
    "httpx>=0.27",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]
web = [
    "next.js",
]

[project.scripts]
tracex = "apps.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.json", "*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D",
]
ignore = ["D100", "D104", "D105", "D107", "D203", "D212", "D213"]

[tool.ruff.lint.isort]
known-first-party = ["packages", "apps"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["packages", "apps"]
omit = ["*/tests/*", "*/migrations/*"]